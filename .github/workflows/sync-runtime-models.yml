name: Sync Runtime Models

# Keeps `InvokeLLMParams.model` in src/modules/integrations.types.ts in sync
# with apper's `RuntimeModel` enum, the backend source of truth for which model
# presets InvokeLLM accepts. Deterministic: scripts/sync-runtime-models.mjs
# rewrites the union from the Python file, and this workflow opens (or updates
# in place) one PR while drift exists. If apper reverts, the PR closes itself.
#
# Once that PR merges, the "Publish SDK Change to Docs" workflow publishes
# just its docs impact as a matching mintlify-docs PR.
#
# Cross-org access: apper lives in base44-dev, this repo in base44. Both tokens
# come from the same GitHub App (BASE44_GITHUB_ACTIONS_APP_ID), which must be
# installed on BOTH orgs: base44-dev with contents:read on apper, and base44
# with contents:write + pull-requests:write on javascript-sdk.

on:
  schedule:
    - cron: "0 6 * * *" # daily, 06:00 UTC
  workflow_dispatch:
    inputs:
      apper_ref:
        description: "apper branch, tag, or SHA to read RuntimeModel from"
        required: false
        default: "main"
        type: string

permissions:
  contents: read

concurrency:
  group: sync-runtime-models
  cancel-in-progress: false

env:
  APPER_REPO: base44-dev/apper
  APPER_PATH: backend/app/integrations/core/runtime_model_config.py

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Wix gateway proxy (mandatory)
        uses: ./.github/actions/wix-gateway-proxy

      # The sync script has no dependencies, so there is no `npm ci` here.
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20.x"

      - name: Generate apper read token
        id: apper-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.BASE44_GITHUB_ACTIONS_APP_ID }}
          private-key: ${{ secrets.BASE44_GITHUB_ACTIONS_APP_PRIVATE_KEY }}
          owner: base44-dev
          repositories: apper
          permission-contents: read

      - name: Fetch RuntimeModel source from apper
        id: fetch
        env:
          GH_TOKEN: ${{ steps.apper-token.outputs.token }}
          APPER_REF: ${{ inputs.apper_ref || 'main' }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/runtime_model_config.py"
          gh api -H "Accept: application/vnd.github.raw+json" \
            "/repos/${APPER_REPO}/contents/${APPER_PATH}?ref=${APPER_REF}" > "$out"
          test -s "$out" || { echo "::error::Fetched an empty file from ${APPER_REPO}:${APPER_PATH}@${APPER_REF}"; exit 1; }
          sha="$(gh api "/repos/${APPER_REPO}/commits?path=${APPER_PATH}&sha=${APPER_REF}&per_page=1" --jq '.[0].sha')"
          test -n "$sha" || { echo "::error::Could not resolve the last commit touching ${APPER_PATH}"; exit 1; }
          echo "Read ${APPER_PATH} at ${APPER_REF} (last changed in ${sha})"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "ref=${APPER_REF}" >> "$GITHUB_OUTPUT"

      - name: Sync the InvokeLLM model union
        id: sync
        run: |
          set -euo pipefail
          node scripts/sync-runtime-models.mjs \
            --source "$RUNNER_TEMP/runtime_model_config.py" \
            --write \
            --summary "$RUNNER_TEMP/summary.md"

      - name: Compose PR body
        env:
          SHA: ${{ steps.fetch.outputs.sha }}
          REF: ${{ steps.fetch.outputs.ref }}
        run: |
          set -euo pipefail
          {
            echo "Source: [\`${APPER_REPO}@${SHA:0:7}\`](https://github.com/${APPER_REPO}/blob/${SHA}/${APPER_PATH}) (ref \`${REF}\`)"
            echo
            cat "$RUNNER_TEMP/summary.md"
            echo
            echo "_Opened by the \`sync-runtime-models\` workflow. It runs daily, updates this PR in place while drift persists, and closes it automatically if apper reverts._"
          } > "$RUNNER_TEMP/pr-body.md"
          cat "$RUNNER_TEMP/pr-body.md"

      # Not GITHUB_TOKEN: pull requests created with it never trigger
      # `pull_request` workflows, so the PR would have no lint, tests, or the
      # required proxy check. The App token also lets the action sign commits
      # as the App's bot user.
      - name: Generate javascript-sdk write token
        id: sdk-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.BASE44_GITHUB_ACTIONS_APP_ID }}
          private-key: ${{ secrets.BASE44_GITHUB_ACTIONS_APP_PRIVATE_KEY }}
          owner: base44
          repositories: javascript-sdk
          permission-contents: write
          permission-pull-requests: write

      # Runs unconditionally on purpose. With no diff it is a no-op, and if a
      # PR is open but the drift is gone (apper reverted, or someone fixed it
      # by hand) the action closes the PR and deletes the branch.
      - name: Open or update pull request
        id: pr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.sdk-token.outputs.token }}
          add-paths: src/modules/integrations.types.ts
          branch: bot/sync-runtime-models
          base: main
          delete-branch: true
          sign-commits: true
          commit-message: |
            fix(types): sync InvokeLLM model union with apper RuntimeModel

            Source: ${{ env.APPER_REPO }}@${{ steps.fetch.outputs.sha }}
            Added: ${{ steps.sync.outputs.added || '(none)' }}
            Removed: ${{ steps.sync.outputs.removed || '(none)' }}
          title: "fix(types): sync InvokeLLM model union with apper RuntimeModel"
          body-path: ${{ runner.temp }}/pr-body.md

      - name: Report
        env:
          CHANGED: ${{ steps.sync.outputs.changed }}
          OPERATION: ${{ steps.pr.outputs.pull-request-operation }}
          URL: ${{ steps.pr.outputs.pull-request-url }}
        run: |
          {
            echo "## Sync Runtime Models"
            echo
            echo "- Drift in working tree: \`${CHANGED}\`"
            echo "- Pull request: \`${OPERATION:-none}\` ${URL}"
            echo
            cat "$RUNNER_TEMP/summary.md"
          } >> "$GITHUB_STEP_SUMMARY"
