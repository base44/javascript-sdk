name: SDK drift

# Drift checks 1-3: keeps the SDK's copies of apper values in step with apper, one rolling
# PR per check on bot/drift/<check>. extract_apper.py reads the apper files; sync-sdk.mjs
# writes the SDK file. When a PR merges, publish-sdk-change-to-docs.yml opens the docs PR.
# Design: "Drift check automation design" (Google Doc).
#
# The docs bot's key reads apper, so it lives in the `drift` environment, which only main
# can use: a branch in this public repo can't run a changed workflow against it. Nothing
# from apper is printed except the values the SDK publishes anyway.

on:
  schedule:
    - cron: "30 5 * * *"  # Daily, 05:30 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  sync:
    name: ${{ matrix.check }}
    runs-on: ubuntu-latest
    environment: drift
    strategy:
      fail-fast: false
      matrix:
        include:
          - check: models
            apper_files: backend/app/integrations/core/runtime_model_config.py
            target: packages/sdk/src/modules/integrations.types.ts
            title: "fix(types): sync InvokeLLM models with apper"
          - check: tool-status
            apper_files: backend/app/ai/models/message.py
            target: packages/sdk/src/modules/agents.types.ts
            title: "fix(types): sync agent tool call statuses with apper"
          - check: connectors
            apper_files: >-
              backend/app/external_auth/integrations/config/connectors.json
              backend/app/external_auth/models/constants.py
            target: packages/sdk/src/modules/connectors.types.ts
            title: "docs(connectors): sync the Available connectors table with apper"
    concurrency:
      group: sdk-drift-${{ matrix.check }}
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Wix gateway proxy (mandatory)
        uses: ./.github/actions/wix-gateway-proxy

      - name: apper read token
        id: apper-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.DOCS_BOT_APP_ID }}
          private-key: ${{ secrets.DOCS_BOT_PRIVATE_KEY }}
          owner: base44-dev
          repositories: apper
          permission-contents: read

      - name: Fetch the apper files
        env:
          GH_TOKEN: ${{ steps.apper-token.outputs.token }}
          FILES: ${{ matrix.apper_files }}
        run: |
          set -euo pipefail
          for rel in $FILES; do
            mkdir -p "$RUNNER_TEMP/apper/$(dirname "$rel")"
            gh api -H "Accept: application/vnd.github.raw+json" "/repos/base44-dev/apper/contents/$rel?ref=main" > "$RUNNER_TEMP/apper/$rel"
            test -s "$RUNNER_TEMP/apper/$rel" || { echo "::error::Fetched an empty $rel"; exit 1; }
          done

      - name: Sync from apper
        env:
          CHECK: ${{ matrix.check }}
        run: |
          set -euo pipefail
          python3 packages/sdk/scripts/drift/extract_apper.py --apper "$RUNNER_TEMP/apper" "$CHECK" > "$RUNNER_TEMP/extract.json"
          node packages/sdk/scripts/drift/sync-sdk.mjs --check "$CHECK" --source "$RUNNER_TEMP/extract.json" --summary "$RUNNER_TEMP/summary.md"
          {
            cat "$RUNNER_TEMP/summary.md"
            echo
            echo "_Opened by the SDK drift workflow. It runs daily and updates this PR while the drift lasts. When it merges, the docs PR opens in mintlify-docs and waits for the next SDK release._"
          } > "$RUNNER_TEMP/pr-body.md"

      - name: javascript-sdk write token
        id: sdk-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.BASE44_GITHUB_ACTIONS_APP_ID }}
          private-key: ${{ secrets.BASE44_GITHUB_ACTIONS_APP_PRIVATE_KEY }}
          owner: base44
          repositories: javascript-sdk
          permission-contents: write
          permission-pull-requests: write

      - name: Open or update the pull request
        id: pr
        uses: ./.github/actions/open-or-update-pr
        with:
          token: ${{ steps.sdk-token.outputs.token }}
          bot-slug: ${{ steps.sdk-token.outputs.app-slug }}
          add-paths: ${{ matrix.target }}
          branch: bot/drift/${{ matrix.check }}
          base: main
          title: ${{ matrix.title }}
          body-path: ${{ runner.temp }}/pr-body.md
          commit-message: ${{ matrix.title }}
          labels: drift

      - name: Report
        env:
          OPERATION: ${{ steps.pr.outputs.operation }}
          URL: ${{ steps.pr.outputs.url }}
        run: |
          {
            echo "## ${{ matrix.check }}"
            echo
            echo "Pull request: \`${OPERATION:-none}\` ${URL}"
            echo
            cat "$RUNNER_TEMP/summary.md"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Open or comment on the failure issue
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ github.token }}
          CHECK: ${{ matrix.check }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="SDK drift check failing: $CHECK"
          gh label create drift --color 0E8A16 --description "Opened by the docs drift workflows" --force
          issue=$(gh issue list --state open --label drift --json number,title --jq ".[] | select(.title == \"$title\") | .number" | head -1)
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --body "Failed again: $RUN_URL"
          else
            gh issue create --title "$title" --label drift --body "The daily SDK drift check \`$CHECK\` failed: $RUN_URL

          Close this issue once it's fixed; the next failure opens a new one."
          fi
