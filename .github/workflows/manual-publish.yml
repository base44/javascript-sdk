name: Manual Package Publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g., 1.0.0, patch, minor, major)"
        required: true
        default: "patch"
        type: string
      npm_tag:
        description: "NPM tag to publish with (e.g., latest, beta, alpha)"
        required: true
        default: "latest"
        type: string
      dry_run:
        description: "Run in dry-run mode (no actual publish)"
        required: false
        default: false
        type: boolean
      notify_skills_repo:
        description: "Notify the skills repo about the release"
        required: false
        default: true
        type: boolean

# This workflow deliberately does NOT run the Wix gateway proxy: the gateway
# cannot carry `npm publish` (it rejects `PUT /<package>`), so per secplatform's
# interim policy for OSS repos this job relies on `npm ci` against the committed
# package-lock.json plus .npmrc's min-release-age instead. It resolves nothing,
# so dropping the gateway does not widen what it can pull. Exemption lives in
# .github/scripts/check_wix_proxy_steps.py.
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      # contents: write for the version-bump commit, tag, and GitHub Release.
      # id-token: write for npm trusted publishing (OIDC).
      contents: write
      id-token: write

    steps:
      - name: Generate a token
        id: generate-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.BASE44_GITHUB_ACTIONS_APP_ID }}
          private-key: ${{ secrets.BASE44_GITHUB_ACTIONS_APP_PRIVATE_KEY }}
          owner: base44

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.generate-token.outputs.token }}

      - name: Enable corepack
        run: corepack enable

      # Node 24, not 20: its bundled npm (>= 11.17) already covers trusted
      # publishing (needs >= 11.5.1) and reads .npmrc's min-release-age (needs
      # >= 11.10.0), so there is no `npm install -g npm@11` fetching a floating
      # npm release outside the cooldown.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run build

      - name: Check if version needs to be bumped
        id: check-version
        run: |
          if [[ "${{ github.event.inputs.version }}" =~ ^(patch|minor|major)$ ]]; then
            echo "bump_version=true" >> $GITHUB_OUTPUT
            echo "version_type=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "bump_version=false" >> $GITHUB_OUTPUT
            echo "version_type=" >> $GITHUB_OUTPUT
          fi

      - name: Bump version
        if: steps.check-version.outputs.bump_version == 'true'
        run: |
          npm version ${{ steps.check-version.outputs.version_type }} --no-git-tag-version
          echo "NEW_VERSION=$(node -p "require('./package.json').version")" >> $GITHUB_ENV

      - name: Set version manually
        if: steps.check-version.outputs.bump_version == 'false'
        run: |
          npm version ${{ github.event.inputs.version }} --no-git-tag-version
          echo "NEW_VERSION=$(node -p "require('./package.json').version")" >> $GITHUB_ENV

      - name: Show package info
        run: |
          echo "Package name: $(node -p "require('./package.json').name")"
          echo "Version: ${{ env.NEW_VERSION }}"
          echo "NPM tag: ${{ github.event.inputs.npm_tag }}"
          echo "Dry run: ${{ github.event.inputs.dry_run }}"

      - name: Publish to NPM
        # Authenticates via npm trusted publishing (OIDC), so no NPM_TOKEN reaches
        # the build. Needs a trusted publisher for `@base44/sdk` on npmjs.com
        # registered against this repo and this workflow filename — the registry
        # keys on the filename, so each publish workflow needs its own entry.
        if: github.event.inputs.dry_run == 'false'
        run: |
          npm publish --tag ${{ github.event.inputs.npm_tag }}

      - name: Dry run publish
        if: github.event.inputs.dry_run == 'true'
        run: |
          npm publish --dry-run --tag ${{ github.event.inputs.npm_tag }}

      - name: Create Git tag
        if: github.event.inputs.dry_run == 'false'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add package.json package-lock.json
          git commit -m "chore: bump version to ${{ env.NEW_VERSION }}"
          git tag v${{ env.NEW_VERSION }}
          git push origin HEAD:${{ github.ref }}
          git push origin v${{ env.NEW_VERSION }}

      - name: Create Release
        if: github.event.inputs.dry_run == 'false'
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ env.NEW_VERSION }}
          release_name: Release v${{ env.NEW_VERSION }}
          body: |
            ## What's Changed

            This release includes the latest updates to the Base44 JavaScript SDK.

            ### Installation

            ```bash
            npm install @base44/sdk@${{ github.event.inputs.npm_tag }}
            ```

            ### Version: ${{ env.NEW_VERSION }}
            ### NPM Tag: ${{ github.event.inputs.npm_tag }}
          draft: false
          prerelease: false

      - name: Notify skills repo
        if: github.event.inputs.dry_run == 'false' && github.event.inputs.notify_skills_repo == 'true'
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ steps.generate-token.outputs.token }}
          repository: base44/skills
          event-type: sdk-release
          client-payload: |
            {
              "version": "v${{ env.NEW_VERSION }}",
              "release_name": "Release v${{ env.NEW_VERSION }}"
            }
